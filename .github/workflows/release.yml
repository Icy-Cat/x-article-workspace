name: Release workspace

on:
  push:
    tags:
      - "workspace-*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create or publish, for example workspace-2026-03-23"
        required: true
        type: string
      release_name:
        description: "Optional release title override"
        required: false
        type: string
      prerelease:
        description: "Mark this release as a prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
            TITLE="${{ inputs.release_name }}"
            PRERELEASE="${{ inputs.prerelease }}"
          else
            TAG="${GITHUB_REF_NAME}"
            TITLE=""
            PRERELEASE="false"
          fi

          if [ -z "$TITLE" ]; then
            TITLE="$TAG"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Build Obsidian host
        run: pnpm -C apps/obsidian build

      - name: Build and package VS Code host
        run: pnpm -C apps/vscode package

      - name: Read component versions
        id: versions
        shell: bash
        run: |
          echo "obsidian_version=$(node -p "require('./apps/obsidian/manifest.json').version")" >> "$GITHUB_OUTPUT"
          echo "obsidian_id=$(node -p "require('./apps/obsidian/manifest.json').id")" >> "$GITHUB_OUTPUT"
          echo "vscode_version=$(node -p "require('./apps/vscode/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Verify Obsidian release files
        run: |
          test -f apps/obsidian/main.js
          test -f apps/obsidian/manifest.json
          test -f apps/obsidian/styles.css

      - name: Package release assets
        shell: bash
        run: |
          RELEASE_TAG="${{ steps.meta.outputs.tag }}"
          OBSIDIAN_ID="${{ steps.versions.outputs.obsidian_id }}"
          OBSIDIAN_VERSION="${{ steps.versions.outputs.obsidian_version }}"
          VSCODE_VERSION="${{ steps.versions.outputs.vscode_version }}"

          mkdir -p dist/obsidian/"$OBSIDIAN_ID"
          cp apps/obsidian/main.js apps/obsidian/manifest.json apps/obsidian/styles.css dist/obsidian/"$OBSIDIAN_ID"/
          (
            cd dist/obsidian
            zip -r "../../${OBSIDIAN_ID}-${OBSIDIAN_VERSION}.zip" "$OBSIDIAN_ID"
          )

          cp "apps/vscode/x-article-vscode-${VSCODE_VERSION}.vsix" "x-article-vscode-${VSCODE_VERSION}.vsix"

          zip -r "x-article-upload-skill-${RELEASE_TAG}.zip" skills/x-article-upload -x "skills/x-article-upload/.env"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: workspace-release-${{ steps.meta.outputs.tag }}
          path: |
            apps/obsidian/main.js
            apps/obsidian/manifest.json
            apps/obsidian/styles.css
            ${{ steps.versions.outputs.obsidian_id }}-${{ steps.versions.outputs.obsidian_version }}.zip
            x-article-vscode-${{ steps.versions.outputs.vscode_version }}.vsix
            x-article-upload-skill-${{ steps.meta.outputs.tag }}.zip

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: |
            apps/obsidian/main.js
            apps/obsidian/manifest.json
            apps/obsidian/styles.css
            ${{ steps.versions.outputs.obsidian_id }}-${{ steps.versions.outputs.obsidian_version }}.zip
            x-article-vscode-${{ steps.versions.outputs.vscode_version }}.vsix
            x-article-upload-skill-${{ steps.meta.outputs.tag }}.zip
